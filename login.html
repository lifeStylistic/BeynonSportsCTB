<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — CTB Exam Prep</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body">

  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo-wrap">
        <img src="certified track builder logo.png" alt="Certified Track Builder" class="auth-logo" />
      </div>

      <h1 class="auth-title">Sign In</h1>
      <p class="auth-subtitle">CTB Exam Prep &mdash; ASBA Certified Track Builder</p>

      <form class="auth-form" id="loginForm" novalidate>

        <div class="auth-field">
          <label class="auth-label" for="loginEmail">Email</label>
          <input
            class="auth-input"
            type="email"
            id="loginEmail"
            name="email"
            autocomplete="email"
            required
            placeholder="you@example.com"
          />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="loginPassword">
            Password
            <button type="button" class="auth-forgot-link" id="forgotPasswordBtn">Forgot password?</button>
          </label>
          <input
            class="auth-input"
            type="password"
            id="loginPassword"
            name="password"
            autocomplete="current-password"
            required
            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
          />
        </div>

        <div class="auth-error"   id="loginError"   hidden></div>
        <div class="auth-success" id="loginSuccess" hidden></div>

        <button class="btn-primary auth-submit" type="submit" id="loginSubmit">
          Sign In
        </button>

      </form>

      <p class="auth-switch">
        Don&rsquo;t have an account? <a href="signup.html" class="auth-link">Create one</a>
      </p>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    'use strict';

    // Redirect to app if already signed in
    (async function() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) { window.location.replace('index.html'); }
    })();

    const form       = document.getElementById('loginForm');
    const emailInput = document.getElementById('loginEmail');
    const passInput  = document.getElementById('loginPassword');
    const errorEl    = document.getElementById('loginError');
    const successEl  = document.getElementById('loginSuccess');
    const submitBtn  = document.getElementById('loginSubmit');
    const forgotBtn  = document.getElementById('forgotPasswordBtn');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden      = false;
      successEl.hidden    = true;
    }

    function showSuccess(msg) {
      successEl.textContent = msg;
      successEl.hidden      = false;
      errorEl.hidden        = true;
    }

    function setLoading(loading) {
      submitBtn.disabled    = loading;
      submitBtn.textContent = loading ? 'Signing in…' : 'Sign In';
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      errorEl.hidden  = true;
      successEl.hidden = true;

      const email    = emailInput.value.trim();
      const password = passInput.value;

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      setLoading(true);

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        showError(error.message);
        setLoading(false);
        return;
      }

      window.location.replace('index.html');
    });

    // Forgot password — sends a reset email via Supabase.
    // Note: A /reset-password.html page is required to handle the redirect
    // from the reset email link. This will be added in a future phase.
    forgotBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) {
        showError('Enter your email address above, then click Forgot password.');
        return;
      }

      forgotBtn.disabled = true;

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/login.html',
      });

      if (error) {
        showError(error.message);
      } else {
        showSuccess('Password reset email sent. Check your inbox.');
      }

      forgotBtn.disabled = false;
    });
  </script>

</body>
</html>
