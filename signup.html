<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — CTB Exam Prep</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body">

  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo-wrap">
        <img src="certified track builder logo.png" alt="Certified Track Builder" class="auth-logo" />
      </div>

      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">CTB Exam Prep &mdash; ASBA Certified Track Builder</p>

      <form class="auth-form" id="signupForm" novalidate>

        <div class="auth-field">
          <label class="auth-label" for="signupName">Full Name</label>
          <input
            class="auth-input"
            type="text"
            id="signupName"
            name="name"
            autocomplete="name"
            required
            placeholder="Your full name"
          />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="signupEmail">Email</label>
          <input
            class="auth-input"
            type="email"
            id="signupEmail"
            name="email"
            autocomplete="email"
            required
            placeholder="you@example.com"
          />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="signupPassword">Password</label>
          <input
            class="auth-input"
            type="password"
            id="signupPassword"
            name="password"
            autocomplete="new-password"
            required
            minlength="8"
            placeholder="Minimum 8 characters"
          />
        </div>

        <div class="auth-error"   id="signupError"   hidden></div>
        <div class="auth-success" id="signupSuccess" hidden></div>

        <button class="btn-primary auth-submit" type="submit" id="signupSubmit">
          Create Account
        </button>

      </form>

      <p class="auth-switch">
        Already have an account? <a href="login.html" class="auth-link">Sign in</a>
      </p>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    'use strict';

    // Redirect to app if already signed in
    (async function() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) { window.location.replace('index.html'); }
    })();

    const form        = document.getElementById('signupForm');
    const nameInput   = document.getElementById('signupName');
    const emailInput  = document.getElementById('signupEmail');
    const passInput   = document.getElementById('signupPassword');
    const errorEl     = document.getElementById('signupError');
    const successEl   = document.getElementById('signupSuccess');
    const submitBtn   = document.getElementById('signupSubmit');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.hidden      = false;
      successEl.hidden    = true;
    }

    function showSuccess(msg) {
      successEl.textContent = msg;
      successEl.hidden      = false;
      errorEl.hidden        = true;
      form.hidden           = true;
    }

    function setLoading(loading) {
      submitBtn.disabled    = loading;
      submitBtn.textContent = loading ? 'Creating account…' : 'Create Account';
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      errorEl.hidden = true;

      const name     = nameInput.value.trim();
      const email    = emailInput.value.trim();
      const password = passInput.value;

      if (!name || !email || !password) {
        showError('All fields are required.');
        return;
      }

      if (password.length < 8) {
        showError('Password must be at least 8 characters.');
        return;
      }

      setLoading(true);

      const { error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: name },
          emailRedirectTo: window.location.origin + '/index.html',
        },
      });

      if (error) {
        showError(error.message);
        setLoading(false);
        return;
      }

      showSuccess(
        'Account created! Check your email for a confirmation link. ' +
        'Once confirmed, sign in and subscribe to access the full platform.'
      );
    });
  </script>

</body>
</html>
